    OrbitControls
} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


// ============================================================
// SCENE
// ============================================================

const scene = new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.03,
    3000
);

camera.position.set(
    0,
    58,
    125
);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.25;

document.body.appendChild(
    renderer.domElement
);


// ============================================================
// CAMERA CONTROLS
// ============================================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.045;

controls.minDistance = 3;
controls.maxDistance = 350;

controls.zoomSpeed = 0.8;

// LIGHT
// ============================================================

    new THREE.AmbientLight(
        0xffffff,
        0.20

    ambientLight
);

// SUN
// ============================================================

    new THREE.SphereGeometry(
        7,
        64,
        64

const sunMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffd42a

const sun =

    sun
);


// ============================================================
// SUN LIGHT
// ============================================================

const sunLight =

        0xffffff,

        600

sunLight.position.set(
    0,
    0,
    0
);

scene.add(
    sunLight
);


// ============================================================
// SUN GLOW
// ============================================================

const glowGeometry =
    new THREE.SphereGeometry(
        9,
        64,
        64
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xff7200,

        transparent: true,

        opacity: 0.18,

        side: THREE.BackSide
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

scene.add(
    glow
);


// ============================================================
// STARS
// ============================================================

const starGeometry =
    new THREE.BufferGeometry();

const starPositions = [];

const starCount = 10000;

for (
    let i = 0;
    i < starCount;
    i++
) {

    const radius =
        450 + Math.random() * 650;

    const theta =
        Math.random() * Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    const x =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    const z =
        radius *
        Math.cos(phi);

    starPositions.push(
        x,
        y,
        z
    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.45
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(
    stars
);


// ============================================================
// CANVAS TEXTURE HELPER
// ============================================================

function createCanvas() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 512;

    const ctx =
        canvas.getContext("2d");

    return {
        canvas,
        ctx
    };
}


// ============================================================
// EARTH TEXTURE
// ============================================================

function createEarthTexture() {

    const {
        canvas,
        ctx
    } = createCanvas();


    // OCEAN

    ctx.fillStyle =
        "#126fd0";

    ctx.fillRect(
        0,
        0,
        1024,
        512
    );


    // LAND

    for (
        let i = 0;
        i < 65;
        i++
    ) {

        const x =
            Math.random() * 1024;

        const y =
            Math.random() * 512;

        const w =
            18 + Math.random() * 115;

        const h =
            12 + Math.random() * 65;

        ctx.fillStyle =
            i % 3 === 0
            ? "#78a945"
            : "#299347";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            w,
            h,
            Math.random() * Math.PI,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    // CLOUDS

    for (
        let i = 0;
        i < 110;
        i++
    ) {

        const x =
            Math.random() * 1024;

        const y =
            Math.random() * 512;

        const w =
            10 + Math.random() * 55;

        const h =
            3 + Math.random() * 12;

        ctx.fillStyle =
            "rgba(255,255,255,0.72)";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            w,
            h,
            Math.random() * Math.PI,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    return new THREE.CanvasTexture(
        canvas
    );
}


// ============================================================
// VENUS TEXTURE
// ============================================================

function createVenusTexture() {

    const {
        canvas,
        ctx
    } = createCanvas();

    ctx.fillStyle =
        "#d6a65a";

    ctx.fillRect(
        0,
        0,
        1024,
        512
    );


    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const x =
            Math.random() * 1024;

        const y =
            Math.random() * 512;

        ctx.strokeStyle =
            "rgba(255,225,170,0.55)";

        ctx.lineWidth =
            3 + Math.random() * 8;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x + 80 +
            Math.random() * 180,
            y + Math.random() * 25
        );

        ctx.stroke();
    }


    return new THREE.CanvasTexture(
        canvas
    );
}


// ============================================================
// MARS TEXTURE
// ============================================================

function createMarsTexture() {

    const {
        canvas,
        ctx
    } = createCanvas();

    ctx.fillStyle =
        "#a84732";

    ctx.fillRect(
        0,
        0,
        1024,
        512
    );


    for (
        let i = 0;
        i < 160;
        i++
    ) {

        const x =
            Math.random() * 1024;

        const y =
            Math.random() * 512;

        const r =
            4 + Math.random() * 30;

        ctx.fillStyle =
            Math.random() > 0.5
            ? "#702c24"
            : "#c96a41";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    return new THREE.CanvasTexture(
        canvas
    );
}


// ============================================================
// JUPITER TEXTURE
// ============================================================

function createJupiterTexture() {

    const {
        canvas,
        ctx
    } = createCanvas();

    const bands = [

        "#e3c39d",
        "#a97855",
        "#d9b58c",
        "#986b4d",
        "#ead0aa",
        "#b6815d",
        "#d8ad83"

    ];


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        ctx.fillStyle =
            bands[
                i % bands.length
            ];

        ctx.fillRect(
            0,
            i * 29,
            1024,
            29
        );
    }


    // CLOUD STREAKS

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const x =
            Math.random() * 1024;

        const y =
            Math.random() * 512;

        ctx.fillStyle =
            "rgba(100,60,40,0.30)";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            15 + Math.random() * 40,
            4 + Math.random() * 10,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    // GREAT RED SPOT

    ctx.fillStyle =
        "#a84b36";

    ctx.beginPath();

    ctx.ellipse(
        700,
        350,
        65,
        30,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    return new THREE.CanvasTexture(
        canvas
    );
}


// ============================================================
// SATURN TEXTURE
// ============================================================

function createSaturnTexture() {

    const {
        canvas,
        ctx
    } = createCanvas();

    const colors = [

        "#ead5a5",
        "#cbb07d",
        "#f0dfb7",
        "#b99b69",
        "#e4c993"

    ];


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        ctx.fillStyle =
            colors[
                i % colors.length
            ];

        ctx.fillRect(
            0,
            i * 29,
            1024,
            29
        );
    }


    return new THREE.CanvasTexture(
        canvas
    );
}


// ============================================================
// EARTH DAY/NIGHT SHADER
// ============================================================

const earthTexture =
    createEarthTexture();

const earthUniforms = {

    map: {
        value: earthTexture
    },

    lightPosition: {
        value:
            new THREE.Vector3(
                0,
                0,
                0
            )
    }
};


const earthVertexShader = `

    varying vec2 vUv;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPosition;

    void main() {

        vUv = uv;

        vec4 worldPosition =
            modelMatrix *
            vec4(position, 1.0);

        vWorldPosition =
            worldPosition.xyz;

        vWorldNormal =
            normalize(
                mat3(modelMatrix) *
                normal
            );

        gl_Position =
            projectionMatrix *
            viewMatrix *
            worldPosition;
    }

`;


const earthFragmentShader = `

    uniform sampler2D map;
    uniform vec3 lightPosition;

    varying vec2 vUv;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPosition;

    void main() {

        vec4 tex =
            texture2D(
                map,
                vUv
            );

        vec3 lightDirection =
            normalize(
                lightPosition -
                vWorldPosition
            );

        float brightness =
            dot(
                normalize(vWorldNormal),
                lightDirection
            );

        float day =
            smoothstep(
                -0.08,
                0.18,
                brightness
            );

        vec3 dayColor =
            tex.rgb *
            (0.38 + day * 1.25);

        vec3 nightColor =
            tex.rgb *
            0.025;

        vec3 finalColor =
            mix(
                nightColor,
                dayColor,
                day
            );

        gl_FragColor =
            vec4(
                finalColor,
                1.0
            );
    }

`;

// ============================================================
// PLANETS
// ============================================================

const planets = [];


// ============================================================
// CREATE PLANETS
// ============================================================

planetData.forEach(
    data => {

        // IMPORTANT:
        // This group ONLY controls the orbit.
        // It has NO rotation.
        // Therefore orbit lines stay clean.

        const orbitGroup =
            new THREE.Group();

        scene.add(
            orbitGroup
        );


        let material;


        if (data.earth) {

            material =
                new THREE.ShaderMaterial({

                    uniforms:
                        earthUniforms,

                    vertexShader:
                        earthVertexShader,

                    fragmentShader:
                        earthFragmentShader

                });

        }

        else if (data.texture) {

            material =
                new THREE.MeshStandardMaterial({

                    map: data.texture,

                    roughness: 0.85,

                    metalness: 0

                });

        }

        else {

            material =
                new THREE.MeshStandardMaterial({

                    color: data.color,

                    roughness: 0.85,

                    metalness: 0

                });
        }


        const geometry =
            new THREE.SphereGeometry(
                data.size,
                64,
                64
            );


        const planet =
            new THREE.Mesh(
                geometry,
                material
            );


        // IMPORTANT:
        // Planet's own axis is tilted.
        // Orbit itself remains flat.

        planet.rotation.z =
            data.tilt;


        orbitGroup.add(
            planet
        );


        // SATURN RINGS

        if (
            data.name === "Saturn"
        ) {

            const ringGeometry =
                new THREE.RingGeometry(
                    4,
                    6.5,
                    128
                );


            const ringMaterial =
                new THREE.MeshBasicMaterial({

                    color: 0xd7c28d,

                    side: THREE.DoubleSide,

                    transparent: true,

                    opacity: 0.88

                });


            const ring =
                new THREE.Mesh(
                    ringGeometry,
                    ringMaterial
                );


            ring.rotation.x =
                Math.PI / 2.4;


            planet.add(
                ring
            );
        }


        planets.push({

            name: data.name,

            mesh: planet,

            group: orbitGroup,

            a: data.distance,

            b:
                data.distance *
                Math.sqrt(
                    1 -
                    data.eccentricity *
                    data.eccentricity
                ),

            e: data.eccentricity,

            angle:
                Math.random() *
                Math.PI * 2,

            orbitSpeed:
                data.orbitSpeed,

            rotationSpeed:
                data.rotationSpeed,

            size: data.size

        });

    }
);


// ============================================================
// ONE CLEAN ORBIT FOR EACH PLANET
// ============================================================

planetData.forEach(
    data => {

        const points = [];

        const segments = 300;

        const a =
            data.distance;

        const e =
            data.eccentricity;

        const b =
            a *
            Math.sqrt(
                1 - e * e
            );


        for (
            let i = 0;
            i <= segments;
            i++
        ) {

            const angle =
                (
                    i /
                    segments
                ) *
                Math.PI *
                2;


            const x =
                a *
                (
                    Math.cos(angle) -
                    e
                );

            const z =
                b *
                Math.sin(angle);


            points.push(
                new THREE.Vector3(
                    x,
                    0,
                    z
                )
            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        const material =
            new THREE.LineBasicMaterial({

                color: 0x303030,

                transparent: true,

                opacity: 0.55

            });


        const orbit =
            new THREE.LineLoop(
                geometry,
                material
            );


        // NO ROTATION HERE.
        // All orbit lines are on the same clean plane.

        scene.add(
            orbit
        );

    }
);


// ============================================================
// GET PLANET
// ============================================================

function getPlanetMesh(name) {

    const planet =
        planets.find(
            p =>
            p.name === name
        );

    return planet
        ? planet.mesh
        : null;
}


// ============================================================
// IRREGULAR MOON
// ============================================================

function createIrregularMoon(
    size,
    scaleX,
    scaleY,
    scaleZ
) {

    const geometry =
        new THREE.IcosahedronGeometry(
            size,
            2
        );


    const position =
        geometry.attributes.position;


    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const x =
            position.getX(i);

        const y =
            position.getY(i);

        const z =
            position.getZ(i);


        const variation =
            0.82 +
            Math.random() *
            0.32;


        position.setXYZ(

            i,

            x *
            scaleX *
            variation,

            y *
            scaleY *
            variation,

            z *
            scaleZ *
            variation
        );
    }


    position.needsUpdate =
        true;

    geometry.computeVertexNormals();

    return geometry;
}


// ============================================================
// MOONS
// ============================================================

const moons = [];


// ============================================================
// CREATE MOON
// ============================================================

function createMoon(
    name,
    planetMesh,
    distance,
    size,
    color,
    speed,
    eccentricity = 0.03,
    irregular = false,
    scale = [1, 1, 1]
) {

    if (!planetMesh)
        return;


    // Separate moon system.
    // It follows the planet but doesn't
    // depend on planet's self rotation.

    const moonSystem =
        new THREE.Group();

    planetMesh.add(
        moonSystem
    );


    let geometry;


    if (irregular) {

        geometry =
            createIrregularMoon(
                size,
                scale[0],
                scale[1],
                scale[2]
            );

    } else {

        geometry =
            new THREE.SphereGeometry(
                size,
                32,
                32
            );
    }


    const material =
        new THREE.MeshStandardMaterial({

            color: color,

            roughness: 0.95,

            metalness: 0

        });


    const moon =
        new THREE.Mesh(
            geometry,
            material
        );


    moonSystem.add(
        moon
    );


    moons.push({

        name: name,

        mesh: moon,

        group: moonSystem,

        a: distance,

        b:
            distance *
            Math.sqrt(
                1 -
                eccentricity *
                eccentricity
            ),

        e: eccentricity,

        angle:
            Math.random() *
            Math.PI * 2,

        speed: speed,

        rotation:
            0.006 +
            Math.random() *
            0.012

    });

}

// ============================================================
// RAYCASTER
// ============================================================

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

const objectName =
    document.getElementById(
        "objectName"
    );

let hoveredObject = null;


// ============================================================
// MOUSE HOVER
// ============================================================

window.addEventListener(
    "mousemove",
    event => {

        mouse.x =
            (
                event.clientX /
                window.innerWidth
            ) *
            2 - 1;

        mouse.y =
            -(
                event.clientY /
                window.innerHeight
            ) *
            2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const objects = [];


        planets.forEach(
            p =>
            objects.push(
                p.mesh
            )
        );


        moons.forEach(
            m =>
            objects.push(
                m.mesh
            )
        );


        const hits =
            raycaster.intersectObjects(
                objects,
                false
            );


        if (
            hits.length > 0
        ) {

            hoveredObject =
                hits[0].object;


            let name =
                "Object";


            const planet =
                planets.find(
                    p =>
                    p.mesh ===
                    hoveredObject
                );


            const moon =
                moons.find(
                    m =>
                    m.mesh ===
                    hoveredObject
                );


            if (planet) {

                name =
                    planet.name;

            }

            else if (moon) {

                name =
                    moon.name;
            }


            objectName.style.display =
                "block";


            objectName.style.left =
                (
                    event.clientX +
                    12
                ) + "px";


            objectName.style.top =
                (
                    event.clientY +
                    12
                ) + "px";


            objectName.textContent =
                name;

        }

        else {

            hoveredObject =
                null;

            objectName.style.display =
                "none";
        }

    }
);


// ============================================================
// SMART ZOOM
// ============================================================

renderer.domElement.addEventListener(
    "wheel",
    event => {

        if (!hoveredObject)
            return;


        event.preventDefault();


        const target =
            hoveredObject.getWorldPosition(
                new THREE.Vector3()
            );


        const direction =
            new THREE.Vector3()
                .subVectors(
                    camera.position,
                    target
                )
                .normalize();


        const distance =
            camera.position.distanceTo(
                target
            );


        let newDistance;


        if (
            event.deltaY < 0
        ) {

            newDistance =
                distance * 0.82;

        }

        else {

            newDistance =
                distance * 1.22;
        }


        newDistance =
            THREE.MathUtils.clamp(
                newDistance,
                1.5,
                350
            );


        const newPosition =
            target.clone().add(
                direction.multiplyScalar(
                    newDistance
                )
            );


        camera.position.lerp(
            newPosition,
            0.7
        );


        controls.target.lerp(
            target,
            0.7
        );


        controls.update();

    },
    {
        passive: false
    }
);


// ============================================================
// PLANET ORBIT
// ============================================================
//
// Planet's orbit:
//      ☀️ ───────── 🪐
//
// Planet's own rotation:
//                    🪐 ↻
//
// Ikkalasi endi bir-biriga aralashmaydi.
//

function updatePlanetOrbit(p) {

    const e =
        p.e;

    const a =
        p.a;

    const b =
        p.b;


    const radius =
        a *
        (1 - e * e) /
        (
            1 +
            e *
            Math.cos(p.angle)
        );


    // Faster near Sun.
    // Slower farther away.

    const normalizedSpeed =
        Math.pow(
            a / radius,
            2
        );


    p.angle +=
        p.orbitSpeed *
        normalizedSpeed;


    const x =
        a *
        (
            Math.cos(p.angle) -
            e
        );

    const z =
        b *
        Math.sin(p.angle);


    // ONLY orbit movement

    p.group.position.x =
        x;

    p.group.position.z =
        z;


    // ONLY planet self rotation

    p.mesh.rotation.y +=
        p.rotationSpeed;
}


// ============================================================
// MOON ORBIT
// ============================================================

function updateMoon(m) {

    const e =
        m.e;

    const a =
        m.a;

    const b =
        m.b;


    const radius =
        a *
        (1 - e * e) /
        (
            1 +
            e *
            Math.cos(m.angle)
        );


    const speed =
        m.speed *
        Math.pow(
            a / radius,
            2
        );


    m.angle +=
        speed;


    const x =
        a *
        (
            Math.cos(m.angle) -
            e
        );

    const z =
        b *
        Math.sin(m.angle);


    m.group.position.x =
        x;

    m.group.position.z =
        z;


    // Moon own rotation

    m.mesh.rotation.y +=
        m.rotation;
}


// ============================================================
// ANIMATION
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    // Sun self rotation

    sun.rotation.y +=
        0.0007;


    // Sun glow

    const pulse =
        1 +
        Math.sin(
            Date.now() * 0.001
        ) *
        0.035;


    glow.scale.set(
        pulse,
        pulse,
        pulse
    );


    // PLANETS

    planets.forEach(
        updatePlanetOrbit
    );


    // MOONS

    moons.forEach(
        updateMoon
    );


    // STARS

    stars.rotation.y +=
        0.00001;


    // Earth shader follows Sun

    earthUniforms
        .lightPosition
        .value.copy(
            sun.getWorldPosition(
                new THREE.Vector3()
            )
        );


    controls.update();


    renderer.render(
        scene,
        camera
    );
}


animate();


// ============================================================
// WINDOW RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
